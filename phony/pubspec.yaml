name: phony
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.34.0
  path_provider: ^2.1.0
  path: ^1.8.0
  file_picker: ^11.0.0
  crypto: ^3.0.3
  sqlite3: ^3.5.0
  provider: ^6.1.5+1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  shared_preferences: ^2.5.5
  archive: ^4.0.9
  permission_handler: ^12.0.3
  external_path: ^2.2.0
  audio_metadata_reader: ^1.6.0
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.34.0
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/phony.png"
  android: true
  windows:
    generate: true
    icon_size: 256

assets:
  - assets/icon