name: phony
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0
  file_picker: ^8.0.0
  audiotags: ^1.0.2
  crypto: ^3.0.3
  sqlite3: ^2.9.4
  provider: ^6.1.5+1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  shared_preferences: ^2.5.5
  archive: ^4.0.9
  permission_handler: ^12.0.3
  external_path: ^2.2.0
  audio_metadata_reader: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  drift_dev: ^2.14.0
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

