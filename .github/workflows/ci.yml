# Continuous integration for phony.
#
# The Flutter project lives in the `phony/` subdirectory of this repository, so
# every `run` step below is executed from there (see `defaults` further down).
# Paths given to actions (upload-artifact) are NOT affected by that default and
# stay relative to the repository root.
name: CI

on:
  push:
    branches: [main, dev]
  # Every pull request is checked, whatever the source branch: nothing gets
  # reviewed before the pipeline is green.
  pull_request:
  workflow_dispatch:

# A new push on the same branch cancels the run still in progress: only the
# latest commit is worth minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the version used for development, so a Flutter release cannot
  # turn the pipeline red on its own.
  FLUTTER_VERSION: 3.44.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: phony

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Before code generation on purpose: the generated `*.g.dart` files are
      # not hand-written, and holding them to the project's formatting rules
      # would only report noise.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # `*.g.dart` files are git-ignored, so the drift code has to be generated
      # here. Without this step the analyzer fails on the missing database code.
      - name: Generate drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: phony/coverage/lcov.info
          if-no-files-found: error

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    # An artifact is only produced from a revision that passed the checks.
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin 8.9 requires a JDK 17 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build

      # Signed with the debug key: this artifact proves the application builds,
      # it is not a store release.
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phony-apk
          path: phony/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
